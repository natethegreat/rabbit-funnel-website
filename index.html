<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Rabbit Funnel makes CRM feel simpler. Get in touch at nate@rabbitfunnel.com.">
  <title>Rabbit Funnel — CRM, simplified.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #fff;
      color: #171717;
      font-family: "DM Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      padding: 32px 24px;
      text-align: center;
    }
    main {
      grid-row: 2;
      width: 100%;
      max-width: 560px;
      margin: auto;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 72px);
      font-weight: 700;
      letter-spacing: -0.075em;
      line-height: 1.05;
    }
    .tagline {
      margin: 22px 0 36px;
      color: #666;
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.4;
    }
    .contact {
      display: inline-block;
      color: #171717;
      font-size: 16px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
    }
    .contact:hover { color: #666; }
    .contact:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    footer {
      grid-row: 3;
      align-self: end;
      color: #999;
      font-size: 12px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <h1>Rabbit Funnel</h1>
      <p class="tagline">CRM, simplified.</p>
      <a class="contact" href="mailto:nate@rabbitfunnel.com">nate@rabbitfunnel.com</a>
    </main>
    <footer>© <span id="year">2026</span> Rabbit Funnel</footer>
  </div>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
